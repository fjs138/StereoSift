[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the project root importable so `pytest` behaves like `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "depth_anything_v2",
    "video_depth_anything_repo",
    "venv",
]
[tool.ruff.lint]
select = ["E9", "F"]
