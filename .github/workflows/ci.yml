name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # Only the lightweight deps the unit tests import. torch, ultralytics and
      # tkinter are runtime/GUI concerns, so the two tests needing them are
      # excluded below and covered locally instead. Keeps CI fast and hermetic.
      - name: Install test deps
        run: |
          pip install -r requirements-dev.txt
          pip install Pillow numpy opencv-python-headless requests imageio imageio-ffmpeg tqdm

      - name: Run tests
        run: pytest -q --ignore=tests/test_gui_helpers.py --ignore=tests/test_video_converter.py
