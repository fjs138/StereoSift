name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # tkinter is a system package, not a wheel; tests/test_gui_helpers.py needs it.
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk

      # CPU-only torch keeps the runner fast; the GPU build is not needed for tests.
      - name: Install Python deps
        run: |
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install Pillow numpy opencv-python-headless requests imageio imageio-ffmpeg tqdm huggingface_hub

      - name: Run tests
        run: pytest -q
